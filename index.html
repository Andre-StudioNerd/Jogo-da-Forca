<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <!-- Meta tags -->
    <meta
      name="description"
      content="Desafie seus amigos no clássico Jogo da forca diretamente no navegador."
    />
    <meta name="author" content="André" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph (Redes Sociais) -->
    <meta property="og:title" content="Jogo da forca" />
    <meta
      property="og:description"
      content="Jogue o clássico Jogo da forca online!"
    />
    <meta property="og:image" content="img/favicon.png" />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/png" href="img/favicon.png">
    <link rel="preload" as="image" href="img/forca.png" fetchpriority="high" />
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <link rel="stylesheet" href="./css/forca.css" media="screen">
   <link rel="stylesheet" href="./css/boxicons.min.css">
    <title>Jogo da Forca</title>
</head>
<body>
     <main>
    <div class="container">

        <div id="imagem"></div>
        <div id="titulo">
            <h1>JOGO DA FORCA</h1>
        </div>
        <div id="teclado">
            <div class="teclas_index">
                <button id="tecla" onclick="window.location.href='forca.html'">JOGAR</button>
                <button id="tecla" onclick="window.location.href='regras.html'">REGRAS</button>

            </div>


        </div>

        <!-- Modal Adicionar Palavra -->
        <div id="modal-alerta" class="modal-container">
            <div class="modal-add-palavra">
                <div class="modal-header-add-palavra" id="modal-titulo">
                    <span id="fechaModal" class="close">&times;</span>
                    <h2>ADICIONAR PALAVRA</h2>
                </div>
                <div class="modal-body-add-palavra" id="modal-mensagem">
                    <input id="addPalavra" type="text" placeholder="PALAVRA" required>
                    <input id="addCategoria" type="text" placeholder="CATEGORIA" required>
                    <button onclick="adicionarPalavra()">Adicionar</button>
                </div>
            </div>
        </div>
    </div>



    <button id="abreModalAddPalavra"></button>
    <img src="img/jogarNovamente.gif" id="jogarNovamente"></img>
    <button id="recarregar" onclick="sortear()" name="recarregar" aria-label="Recarregar jogo"></button>
    <button id="jogarAutomatico" onclick="listaAutomatica()" name="jogarAutomatico" aria-label="Jogar automaticamente"></button>
    <script>
document.addEventListener("DOMContentLoaded", function () {
    document.cookie.split(";").forEach(function(cookie) {
        const nome = cookie.split("=")[0].trim();
        document.cookie = nome + "=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
    });
});
</script>

    <script src="js/forca.js"></script>
    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>

    </main>
    <footer><p>Desenvolvido por André Luis Fernandes</p></footer>
</body>
</html>
